# Scans this repo with Meterian under our own account (METERIAN_API_TOKEN),
# so the account's Configuration (e.g. unmaintained-library severity) and the
# .meterian exclusions file apply. Scans without a token land on Meterian's
# public default account, where neither applies.
name: Meterian scan

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *" # daily, so newly published advisories reach the report
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meterian:
    name: Meterian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Meterian Scanner
        uses: MeterianHQ/meterian-github-action@9603528ad7eb3e76e7181d8d721bba25665a403d # v1.0.18
        env:
          METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
